<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #fff;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* 主圖片 */
        .main-image {
            display: block;

            max-width: 100vw;
            max-height: 100vh;
            max-height: 100svh;

            width: auto;
            height: auto;

            object-fit: contain;
        }


        /* =========================
           浮動影片視窗
        ========================= */

        .video-container {
            position: fixed;

            /* 初始位置 */
            right: 20px;
            bottom: 20px;

            /* 電腦尺寸 */
            width: 500px;
            height: 281px;

            z-index: 9999;

            background: #000;

            border-radius: 12px;

            overflow: hidden;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

            /* 電腦可以拖 */
            cursor: grab;

            /* 防止手機拖曳時整個網頁跟著滑 */
            touch-action: none;

            user-select: none;
        }

        .video-container:active {
            cursor: grabbing;
        }


        /* 影片 */

        .floating-video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            pointer-events: none;

            user-select: none;
        }


        /* 聲音圖示 */

        .sound-indicator {
            position: absolute;

            right: 10px;
            bottom: 10px;

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.7);

            color: white;

            font-size: 18px;

            pointer-events: none;

            user-select: none;
        }


        /* =========================
           手機
        ========================= */

        @media (max-width: 600px) {

            .video-container {

                right: 12px;
                bottom: 12px;

                width: min(300px, calc(100vw - 24px));

                height: auto;

                aspect-ratio: 16 / 9;

                border-radius: 8px;
            }

            .sound-indicator {

                right: 6px;
                bottom: 6px;

                width: 30px;
                height: 30px;

                font-size: 14px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         主圖片
    ========================= -->

    <img
        class="main-image"
        src="image.jpg"
        alt=""
    >


    <!-- =========================
         浮動影片
    ========================= -->

    <div
        class="video-container"
        id="videoContainer"
    >

        <video
            class="floating-video"
            id="floatingVideo"
            src="music.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        ></video>


        <div
            class="sound-indicator"
            id="soundIndicator"
        >
            🔇
        </div>

    </div>



    <script>

        const video =
            document.getElementById("floatingVideo");

        const container =
            document.getElementById("videoContainer");

        const indicator =
            document.getElementById("soundIndicator");


        /* =========================
           自動播放
        ========================= */

        window.addEventListener("load", function () {

            video.muted = true;

            video.loop = true;

            video.play().catch(function (error) {

                console.log(
                    "自動播放被瀏覽器阻止：",
                    error
                );

            });

        });



        /* =========================
           拖曳功能
        ========================= */

        let isDragging = false;

        let startX = 0;
        let startY = 0;

        let startLeft = 0;
        let startTop = 0;

        let moved = false;


        /* 按下 */

        container.addEventListener(
            "pointerdown",
            function (event) {

                isDragging = true;

                moved = false;

                startX = event.clientX;
                startY = event.clientY;

                const rect =
                    container.getBoundingClientRect();

                startLeft = rect.left;
                startTop = rect.top;


                /* 抓住這個指標 */

                container.setPointerCapture(
                    event.pointerId
                );

            }
        );


        /* 移動 */

        container.addEventListener(
            "pointermove",
            function (event) {

                if (!isDragging) {
                    return;
                }


                const deltaX =
                    event.clientX - startX;

                const deltaY =
                    event.clientY - startY;


                /* 移動超過幾 px 就視為拖曳 */

                if (
                    Math.abs(deltaX) > 5 ||
                    Math.abs(deltaY) > 5
                ) {

                    moved = true;

                }


                let newLeft =
                    startLeft + deltaX;

                let newTop =
                    startTop + deltaY;


                /* 不允許拖出螢幕 */

                const maxLeft =
                    window.innerWidth -
                    container.offsetWidth;

                const maxTop =
                    window.innerHeight -
                    container.offsetHeight;


                newLeft =
                    Math.max(
                        0,
                        Math.min(
                            newLeft,
                            maxLeft
                        )
                    );


                newTop =
                    Math.max(
                        0,
                        Math.min(
                            newTop,
                            maxTop
                        )
                    );


                /* 改成 left / top */

                container.style.left =
                    newLeft + "px";

                container.style.top =
                    newTop + "px";

                container.style.right =
                    "auto";

                container.style.bottom =
                    "auto";

            }
        );


        /* 放開 */

        container.addEventListener(
            "pointerup",
            function (event) {

                isDragging = false;

                try {

                    container.releasePointerCapture(
                        event.pointerId
                    );

                } catch (error) {}

            }
        );


        container.addEventListener(
            "pointercancel",
            function () {

                isDragging = false;

            }
        );



        /* =========================
           點擊切換聲音
        ========================= */

        container.addEventListener(
            "click",
            function () {

                /*
                 如果剛剛有拖曳，
                 就不要把拖曳當成點擊
                */

                if (moved) {

                    moved = false;

                    return;

                }


                if (video.muted) {

                    video.muted = false;

                    video.volume = 1;

                    indicator.textContent = "🔊";

                    video.play();

                } else {

                    video.muted = true;

                    indicator.textContent = "🔇";

                }

            }
        );

    </script>


</body>

</html>
