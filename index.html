<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title></title>

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            background: #fff;

            overflow: hidden;
        }


        body {

            min-height: 100vh;
            min-height: 100svh;

            display: flex;

            align-items: center;
            justify-content: center;

            touch-action: none;
        }


        /* =====================================
           主圖片
        ===================================== */

        .main-image {

            display: block;

            max-width: 100vw;

            max-height: 100vh;
            max-height: 100svh;

            width: auto;
            height: auto;

            object-fit: contain;

            user-select: none;

            -webkit-user-drag: none;
        }



        /* =====================================
           浮動影片
        ===================================== */

        .video-container {

            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 500px;
            height: 281px;

            z-index: 9999;

            background: #000;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.35);

            cursor: grab;

            touch-action: none;

            user-select: none;

            transition:
                width 0.25s ease,
                height 0.25s ease,
                transform 0.25s ease,
                border-radius 0.25s ease,
                box-shadow 0.25s ease;
        }


        .video-container:active {

            cursor: grabbing;
        }



        /* =====================================
           影片
        ===================================== */

        .floating-video {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            pointer-events: none;

            user-select: none;

            -webkit-user-drag: none;
        }



        /* =====================================
           聲音提示
        ===================================== */

        .sound-indicator {

            position: absolute;

            top: 8px;
            right: 52px;

            width: 36px;
            height: 36px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.72);

            color: #fff;

            font-size: 17px;

            pointer-events: none;

            z-index: 20;
        }



        /* =====================================
           假 ×
        ===================================== */

        .fake-close {

            position: absolute;

            top: 8px;
            right: 8px;

            width: 36px;
            height: 36px;

            border: none;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.72);

            color: #fff;

            font-size: 21px;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 30;

            padding: 0;

            touch-action: manipulation;
        }



        /* =====================================
           控制按鈕
        ===================================== */

        .controls {

            position: absolute;

            left: 8px;
            bottom: 8px;

            display: flex;

            gap: 6px;

            opacity: 0;

            transition:
                opacity 0.2s ease;

            z-index: 30;
        }


        .video-container:hover .controls {

            opacity: 1;
        }


        .control-button {

            width: 36px;
            height: 36px;

            border: none;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.72);

            color: #fff;

            font-size: 16px;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            padding: 0;

            touch-action: manipulation;
        }



        /* =====================================
           放大
        ===================================== */

        .fullscreen-funny {

            left: 50% !important;
            top: 50% !important;

            right: auto !important;
            bottom: auto !important;

            transform:
                translate(-50%, -50%) !important;

            width:
                min(90vw, 900px) !important;

            height: auto !important;

            aspect-ratio: 16 / 9;

            border-radius: 16px;

            box-shadow:
                0 10px 60px
                rgba(0, 0, 0, 0.5);
        }



        /* =====================================
           復活按鈕
        ===================================== */

        .revive-button {

            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 9998;

            display: none;

            border: none;

            padding: 12px 16px;

            border-radius: 999px;

            background: #000;

            color: #fff;

            font-size: 14px;

            cursor: pointer;
        }



        /* =====================================
           手機
        ===================================== */

        @media (max-width: 600px) {

            .video-container {

                right: 12px;
                bottom: 12px;

                width:
                    min(300px, calc(100vw - 24px));

                height: auto;

                aspect-ratio: 16 / 9;

                border-radius: 8px;
            }


            .sound-indicator {

                top: 6px;
                right: 44px;

                width: 30px;
                height: 30px;

                font-size: 14px;
            }


            .fake-close {

                top: 6px;
                right: 6px;

                width: 30px;
                height: 30px;

                font-size: 17px;
            }


            .controls {

                left: 6px;
                bottom: 6px;
            }


            .control-button {

                width: 30px;
                height: 30px;

                font-size: 13px;
            }


            .fullscreen-funny {

                width: 94vw !important;
            }


            .revive-button {

                right: 12px;
                bottom: 12px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================
         主圖片
    ===================================== -->

    <img
        class="main-image"
        src="image.jpg"
        alt=""
        id="mainImage"
    >



    <!-- =====================================
         浮動影片
    ===================================== -->

    <div
        class="video-container"
        id="videoContainer"
    >


        <video
            class="floating-video"
            id="floatingVideo"
            src="music.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        ></video>


        <!-- 聲音 -->

        <div
            class="sound-indicator"
            id="soundIndicator"
        >
            🔇
        </div>


        <!-- 假 × -->

        <button
            class="fake-close"
            id="fakeClose"
            type="button"
        >
            ×
        </button>


        <!-- 控制 -->

        <div class="controls">

            <button
                class="control-button"
                id="playButton"
                type="button"
            >
                ▶
            </button>


            <button
                class="control-button"
                id="muteButton"
                type="button"
            >
                🔇
            </button>

        </div>

    </div>



    <!-- =====================================
         復活
    ===================================== -->

    <button
        class="revive-button"
        id="reviveButton"
        type="button"
    >
        影片不見了
    </button>



    <script>


        /* =====================================
           元素
        ===================================== */

        const video =
            document.getElementById(
                "floatingVideo"
            );

        const container =
            document.getElementById(
                "videoContainer"
            );

        const indicator =
            document.getElementById(
                "soundIndicator"
            );

        const fakeClose =
            document.getElementById(
                "fakeClose"
            );

        const playButton =
            document.getElementById(
                "playButton"
            );

        const muteButton =
            document.getElementById(
                "muteButton"
            );

        const reviveButton =
            document.getElementById(
                "reviveButton"
            );

        const mainImage =
            document.getElementById(
                "mainImage"
            );



        /* =====================================
           自動播放
        ===================================== */

        window.addEventListener(
            "load",
            function () {

                video.muted = true;

                video.loop = true;

                video.play().catch(
                    function (error) {

                        console.log(
                            "Autoplay blocked:",
                            error
                        );

                    }
                );

            }
        );



        /* =====================================
           記住位置
        ===================================== */

        const savedLeft =
            localStorage.getItem(
                "funnyVideoLeft"
            );

        const savedTop =
            localStorage.getItem(
                "funnyVideoTop"
            );


        if (
            savedLeft !== null &&
            savedTop !== null
        ) {

            container.style.left =
                savedLeft + "px";

            container.style.top =
                savedTop + "px";

            container.style.right =
                "auto";

            container.style.bottom =
                "auto";
        }



        /* =====================================
           拖曳
        ===================================== */

        let isDragging = false;

        let moved = false;

        let startX = 0;
        let startY = 0;

        let startLeft = 0;
        let startTop = 0;

        let dragCount = 0;


        container.addEventListener(
            "pointerdown",
            function (event) {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {
                    return;
                }


                if (
                    container.classList.contains(
                        "fullscreen-funny"
                    )
                ) {
                    return;
                }


                isDragging = true;

                moved = false;

                startX =
                    event.clientX;

                startY =
                    event.clientY;


                const rect =
                    container.getBoundingClientRect();


                startLeft =
                    rect.left;

                startTop =
                    rect.top;


                container.setPointerCapture(
                    event.pointerId
                );

            }
        );


        container.addEventListener(
            "pointermove",
            function (event) {

                if (!isDragging) {
                    return;
                }


                const deltaX =
                    event.clientX -
                    startX;

                const deltaY =
                    event.clientY -
                    startY;


                if (
                    Math.abs(deltaX) > 5 ||
                    Math.abs(deltaY) > 5
                ) {

                    moved = true;
                }


                let newLeft =
                    startLeft + deltaX;

                let newTop =
                    startTop + deltaY;


                const maxLeft =
                    window.innerWidth -
                    container.offsetWidth;


                const maxTop =
                    window.innerHeight -
                    container.offsetHeight;


                newLeft =
                    Math.max(
                        0,
                        Math.min(
                            newLeft,
                            maxLeft
                        )
                    );


                newTop =
                    Math.max(
                        0,
                        Math.min(
                            newTop,
                            maxTop
                        )
                    );


                container.style.left =
                    newLeft + "px";

                container.style.top =
                    newTop + "px";

                container.style.right =
                    "auto";

                container.style.bottom =
                    "auto";


                localStorage.setItem(
                    "funnyVideoLeft",
                    newLeft
                );

                localStorage.setItem(
                    "funnyVideoTop",
                    newTop
                );

            }
        );


        container.addEventListener(
            "pointerup",
            function (event) {

                if (moved) {

                    dragCount++;

                    /*
                     每拖五次變大
                    */

                    if (
                        dragCount % 5 === 0
                    ) {

                        enlargeVideo();
                    }
                }


                isDragging = false;


                try {

                    container.releasePointerCapture(
                        event.pointerId
                    );

                } catch (error) {}

            }
        );


        container.addEventListener(
            "pointercancel",
            function () {

                isDragging = false;

            }
        );



        /* =====================================
           點擊影片
        ===================================== */

        container.addEventListener(
            "click",
            function (event) {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {
                    return;
                }


                if (moved) {

                    moved = false;

                    return;
                }


                toggleMute();

            }
        );



        /* =====================================
           聲音
        ===================================== */

        function toggleMute() {

            if (video.muted) {

                video.muted = false;

                video.volume = 1;

                indicator.textContent =
                    "🔊";

                muteButton.textContent =
                    "🔊";

                video.play();

            } else {

                video.muted = true;

                indicator.textContent =
                    "🔇";

                muteButton.textContent =
                    "🔇";
            }
        }



        /* =====================================
           播放 / 暫停
        ===================================== */

        playButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                if (video.paused) {

                    video.play();

                    playButton.textContent =
                        "⏸";

                } else {

                    video.pause();

                    playButton.textContent =
                        "▶";
                }

            }
        );



        /* =====================================
           靜音
        ===================================== */

        muteButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                toggleMute();

            }
        );



        /* =====================================
           雙擊放大
        ===================================== */

        container.addEventListener(
            "dblclick",
            function (event) {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {
                    return;
                }


                container.classList.toggle(
                    "fullscreen-funny"
                );

            }
        );



        /* =====================================
           影片變大
        ===================================== */

        function enlargeVideo() {

            if (
                container.classList.contains(
                    "fullscreen-funny"
                )
            ) {
                return;
            }


            const currentWidth =
                container.offsetWidth;


            const newWidth =
                currentWidth + 50;


            const maxWidth =
                window.innerWidth - 20;


            const finalWidth =
                Math.min(
                    newWidth,
                    maxWidth
                );


            const finalHeight =
                Math.round(
                    finalWidth * 9 / 16
                );


            container.style.width =
                finalWidth + "px";

            container.style.height =
                finalHeight + "px";

        }



        /* =====================================
           瞬移
        ===================================== */

        function teleportVideo() {

            if (
                container.classList.contains(
                    "fullscreen-funny"
                )
            ) {
                return;
            }


            const margin = 10;


            const maxLeft =
                window.innerWidth -
                container.offsetWidth -
                margin;


            const maxTop =
                window.innerHeight -
                container.offsetHeight -
                margin;


            if (
                maxLeft <= margin ||
                maxTop <= margin
            ) {
                return;
            }


            const randomLeft =
                Math.floor(
                    Math.random() *
                    (maxLeft - margin)
                ) + margin;


            const randomTop =
                Math.floor(
                    Math.random() *
                    (maxTop - margin)
                ) + margin;


            container.style.left =
                randomLeft + "px";

            container.style.top =
                randomTop + "px";

            container.style.right =
                "auto";

            container.style.bottom =
                "auto";


            localStorage.setItem(
                "funnyVideoLeft",
                randomLeft
            );

            localStorage.setItem(
                "funnyVideoTop",
                randomTop
            );

        }



        /* =====================================
           假 ×
           第一次：瞬移
           第二次：真的消失
        ===================================== */

        let closeClicks = 0;

        let closeTimer = null;


        fakeClose.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                closeClicks++;


                if (closeClicks === 1) {

                    teleportVideo();


                    closeTimer =
                        setTimeout(
                            function () {

                                closeClicks = 0;

                            },
                            1200
                        );

                } else {

                    clearTimeout(
                        closeTimer
                    );

                    closeClicks = 0;

                    hideVideo();
                }

            }
        );



        /* =====================================
           消失
        ===================================== */

        function hideVideo() {

            container.style.display =
                "none";

            reviveButton.style.display =
                "block";


            setTimeout(
                function () {

                    reviveVideo();

                },
                5000
            );

        }


        function reviveVideo() {

            container.style.display =
                "block";

            reviveButton.style.display =
                "none";

            teleportVideo();

        }


        reviveButton.addEventListener(
            "click",
            function () {

                reviveVideo();

            }
        );



        /* =====================================
           電腦：
           滑鼠靠近就逃跑
        ===================================== */

        let lastEscape =
            0;


        document.addEventListener(
            "pointermove",
            function (event) {

                /*
                 只有滑鼠使用
                */

                if (
                    event.pointerType !==
                    "mouse"
                ) {
                    return;
                }


                if (
                    container.classList.contains(
                        "fullscreen-funny"
                    )
                ) {
                    return;
                }


                const now =
                    Date.now();


                if (
                    now - lastEscape < 900
                ) {
                    return;
                }


                const rect =
                    container.getBoundingClientRect();


                const centerX =
                    rect.left +
                    rect.width / 2;


                const centerY =
                    rect.top +
                    rect.height / 2;


                const distance =
                    Math.sqrt(

                        Math.pow(
                            event.clientX -
                            centerX,
                            2
                        )

                        +

                        Math.pow(
                            event.clientY -
                            centerY,
                            2
                        )

                    );


                if (
                    distance < 90
                ) {

                    lastEscape =
                        now;

                    teleportVideo();

                }

            }
        );



        /* =====================================
           手機：
           手指碰影片時有機率逃跑
        ===================================== */

        let lastTouchEscape =
            0;


        container.addEventListener(
            "pointerdown",
            function (event) {

                if (
                    event.pointerType !==
                    "touch"
                ) {
                    return;
                }


                const now =
                    Date.now();


                if (
                    now - lastTouchEscape <
                    1200
                ) {
                    return;
                }


                /*
                 45% 機率逃跑
                */

                if (
                    Math.random() < 0.45
                ) {

                    lastTouchEscape =
                        now;


                    setTimeout(
                        function () {

                            if (
                                !isDragging
                            ) {

                                teleportVideo();

                            }

                        },
                        120
                    );

                }

            }
        );



        /* =====================================
           手機：
           手指碰主圖片
           也可能讓影片跑掉
        ===================================== */

        mainImage.addEventListener(
            "pointerdown",
            function (event) {

                if (
                    event.pointerType !==
                    "touch"
                ) {
                    return;
                }


                /*
                 25% 機率
                */

                if (
                    Math.random() < 0.25
                ) {

                    setTimeout(
                        function () {

                            teleportVideo();

                        },
                        250
                    );

                }

            }
        );



        /* =====================================
           手機：
           長按影片
           有機率逃跑
        ===================================== */

        let longPressTimer =
            null;


        container.addEventListener(
            "pointerdown",
            function (event) {

                if (
                    event.pointerType !==
                    "touch"
                ) {
                    return;
                }


                longPressTimer =
                    setTimeout(
                        function () {

                            if (
                                !isDragging
                            ) {

                                if (
                                    Math.random() <
                                    0.75
                                ) {

                                    teleportVideo();

                                }

                            }

                        },
                        700
                    );

            }
        );


        container.addEventListener(
            "pointerup",
            function () {

                clearTimeout(
                    longPressTimer
                );

            }
        );


        container.addEventListener(
            "pointercancel",
            function () {

                clearTimeout(
                    longPressTimer
                );

            }
        );



        /* =====================================
           自己亂跑
           20～35 秒一次
        ===================================== */

        function scheduleRandomMovement() {

            const delay =
                20000 +
                Math.random() * 15000;


            setTimeout(
                function () {

                    /*
                     65% 機率真的跑
                    */

                    if (
                        Math.random() <
                        0.65
                    ) {

                        teleportVideo();

                    }


                    scheduleRandomMovement();

                },
                delay
            );

        }


        scheduleRandomMovement();



        /* =====================================
           螢幕尺寸改變
        ===================================== */

        window.addEventListener(
            "resize",
            function () {

                if (
                    container.style.display ===
                    "none"
                ) {
                    return;
                }


                if (
                    container.classList.contains(
                        "fullscreen-funny"
                    )
                ) {
                    return;
                }


                const rect =
                    container.getBoundingClientRect();


                const maxLeft =
                    window.innerWidth -
                    container.offsetWidth;


                const maxTop =
                    window.innerHeight -
                    container.offsetHeight;


                let newLeft =
                    Math.max(
                        0,
                        Math.min(
                            rect.left,
                            maxLeft
                        )
                    );


                let newTop =
                    Math.max(
                        0,
                        Math.min(
                            rect.top,
                            maxTop
                        )
                    );


                container.style.left =
                    newLeft + "px";

                container.style.top =
                    newTop + "px";

                container.style.right =
                    "auto";

                container.style.bottom =
                    "auto";

            }
        );


    </script>

</body>

</html>
