<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #fff;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .main-image {
            display: block;

            max-width: 100vw;
            max-height: 100vh;
            max-height: 100svh;

            width: auto;
            height: auto;

            object-fit: contain;
        }

        /* 右下角影片 */
        .video-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 500px;
            height: 281px;

            z-index: 9999;

            background: #000;

            border-radius: 12px;

            overflow: hidden;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

            cursor: pointer;
        }

        .floating-video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        /* 聲音提示 */
        .sound-indicator {
            position: absolute;

            right: 10px;
            bottom: 10px;

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.7);

            color: white;

            font-size: 18px;

            pointer-events: none;
        }

        /* 手機 */
        @media (max-width: 600px) {

            .video-container {
                right: 12px;
                bottom: 12px;

                width: min(300px, calc(100vw - 24px));
                height: auto;

                aspect-ratio: 16 / 9;

                border-radius: 8px;
            }

            .sound-indicator {
                right: 6px;
                bottom: 6px;

                width: 30px;
                height: 30px;

                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- 中間主圖片 -->
    <img
        class="main-image"
        src="image.jpg"
        alt=""
    >

    <!-- 右下角影片 -->
    <div
        class="video-container"
        id="videoContainer"
    >

        <video
            class="floating-video"
            id="floatingVideo"
            src="music.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        ></video>

        <!-- 聲音狀態 -->
        <div
            class="sound-indicator"
            id="soundIndicator"
        >
            🔇
        </div>

    </div>

    <script>

        const video =
            document.getElementById("floatingVideo");

        const container =
            document.getElementById("videoContainer");

        const indicator =
            document.getElementById("soundIndicator");


        /* 網頁載入後自動播放 */
        window.addEventListener("load", function () {

            video.muted = true;

            video.loop = true;

            video.play().catch(function (error) {

                console.log(
                    "自動播放被瀏覽器阻止：",
                    error
                );

            });

        });


        /* 點擊影片切換聲音 */
        container.addEventListener("click", function () {

            if (video.muted) {

                video.muted = false;

                video.volume = 1;

                indicator.textContent = "🔊";

                video.play();

            } else {

                video.muted = true;

                indicator.textContent = "🔇";

            }

        });

    </script>

</body>

</html>
