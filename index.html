<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #fff;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        /* =========================
           主圖片
           ========================= */

        .main-image {
            display: block;

            max-width: 100vw;
            max-height: 100vh;
            max-height: 100svh;

            width: auto;
            height: auto;

            object-fit: contain;
        }


        /* =========================
           右下角影片
           ========================= */

        .video-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 220px;
            height: 125px;

            z-index: 9999;

            background: #000;

            border-radius: 12px;

            overflow: hidden;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

            cursor: pointer;
        }


        .floating-video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* =========================
           音量按鈕
           ========================= */

        .sound-indicator {
            position: absolute;

            right: 8px;
            bottom: 8px;

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.7);

            color: white;

            font-size: 16px;

            pointer-events: none;
        }


        /* =========================
           手機
           ========================= */

        @media (max-width: 600px) {

            .video-container {
                right: 12px;
                bottom: 12px;

                width: 140px;
                height: 79px;

                border-radius: 8px;
            }

            .sound-indicator {
                right: 5px;
                bottom: 5px;

                width: 27px;
                height: 27px;

                font-size: 13px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         主圖片
         ========================= -->

    <img
        class="main-image"
        src="image.jpg"
        alt=""
    >


    <!-- =========================
         右下角影片
         ========================= -->

    <div
        class="video-container"
        id="videoContainer"
    >

        <video
            class="floating-video"
            id="floatingVideo"
            src="music.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        ></video>


        <div
            class="sound-indicator"
            id="soundIndicator"
        >
            🔇
        </div>

    </div>


    <script>

        const video =
            document.getElementById("floatingVideo");

        const container =
            document.getElementById("videoContainer");

        const indicator =
            document.getElementById("soundIndicator");


        /* =========================
           網頁載入後自動播放
           ========================= */

        window.addEventListener("load", function () {

            video.muted = true;

            video.loop = true;

            video.play().catch(function(error) {

                console.log(
                    "自動播放被瀏覽器阻止：",
                    error
                );

            });

        });


        /* =========================
           點擊影片
           ========================= */

        container.addEventListener("click", function () {

            /*
             * 如果現在是靜音
             */

            if (video.muted) {

                video.muted = false;

                video.volume = 1;

                indicator.textContent = "🔊";

                video.play();

            }

            /*
             * 如果現在有聲音
             */

            else {

                video.muted = true;

                indicator.textContent = "🔇";

            }

        });

    </script>

</body>

</html>
