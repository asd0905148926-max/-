<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: white;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <!-- 主圖片 -->
    <img src="image.jpg" alt="">

    <!-- 背景音樂 -->
    <audio
        id="bgMusic"
        autoplay
        loop
        preload="auto"
    >
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const bgMusic = document.getElementById("bgMusic");

        // 音量
        bgMusic.volume = 1;

        // 嘗試網頁載入後立即播放
        bgMusic.play().catch(() => {});

        // 如果瀏覽器阻擋自動播放，
        // 第一次點擊時開始播放
        document.addEventListener("click", () => {
            bgMusic.play().catch(() => {});
        }, { once: true });

        // 手機第一次觸碰時開始播放
        document.addEventListener("touchstart", () => {
            bgMusic.play().catch(() => {});
        }, { once: true });
    </script>

</body>
</html>
