<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #fff;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* 中間圖片 */

        .main-image {
            display: block;

            max-width: 100vw;
            max-height: 100vh;
            max-height: 100svh;

            width: auto;
            height: auto;

            object-fit: contain;
        }


        /* 右下角播放器 */

        .video-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 220px;
            height: 125px;

            z-index: 1000;

            border-radius: 12px;

            overflow: hidden;

            background: #000;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);

            cursor: pointer;

            display: none;
        }


        .floating-video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        .sound-indicator {
            position: absolute;

            right: 8px;
            bottom: 8px;

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 16px;

            pointer-events: none;
        }


        /* 手機 */

        @media (max-width: 600px) {

            .video-container {
                right: 12px;
                bottom: 12px;

                width: 140px;
                height: 79px;

                border-radius: 8px;
            }

            .sound-indicator {
                right: 5px;
                bottom: 5px;

                width: 26px;
                height: 26px;

                font-size: 13px;
            }
        }
    </style>
</head>


<body>

    <!-- 主圖片 -->

    <img
        class="main-image"
        src="image.jpg"
        alt=""
    >


    <!-- 浮動影片 -->

    <div
        class="video-container"
        id="videoContainer"
    >

        <video
            class="floating-video"
            id="floatingVideo"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >

            <source
                src="music.mp4"
                type="video/mp4"
            >

        </video>


        <div
            class="sound-indicator"
            id="soundIndicator"
        >
            🔇
        </div>

    </div>


    <script>

        const video =
            document.getElementById("floatingVideo");

        const container =
            document.getElementById("videoContainer");

        const soundIndicator =
            document.getElementById("soundIndicator");


        /*
         * 影片成功載入後才顯示播放器
         */

        video.addEventListener("loadeddata", function () {

            container.style.display = "block";

            video.play().catch(function () {
                // 瀏覽器阻止自動播放時不做任何事
            });

        });


        /*
         * 影片載入失敗
         */

        video.addEventListener("error", function () {

            console.log("影片無法播放");

            container.style.display = "none";

        });


        /*
         * 點擊播放器
         */

        container.addEventListener("click", function () {

            if (video.muted) {

                video.muted = false;

                video.volume = 1;

                soundIndicator.textContent = "🔊";

                video.play();

            } else {

                video.muted = true;

                soundIndicator.textContent = "🔇";

            }

        });

    </script>

</body>

</html>
