<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title></title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            touch-action: none;
        }


        /* =====================================
           主圖片
        ===================================== */

        .main-image {
            display: block;

            max-width: 100vw;
            max-height: 100vh;
            max-height: 100svh;

            width: auto;
            height: auto;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;
        }


        /* =====================================
           浮動影片
        ===================================== */

        .video-container {

            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 500px;
            height: 281px;

            z-index: 9999;

            background: #000;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.4);

            cursor: grab;

            touch-action: none;

            user-select: none;

            transition:
                width 0.18s ease,
                height 0.18s ease,
                transform 0.18s ease,
                border-radius 0.18s ease;
        }


        .video-container:active {
            cursor: grabbing;
        }


        /* =====================================
           影片
        ===================================== */

        .floating-video {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            pointer-events: none;

            user-select: none;

            -webkit-user-drag: none;
        }


        /* =====================================
           聲音提示
        ===================================== */

        .sound-indicator {

            position: absolute;

            top: 10px;
            right: 58px;

            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.75);

            color: #fff;

            font-size: 18px;

            pointer-events: none;

            z-index: 20;
        }


        /* =====================================
           假 ×
        ===================================== */

        .fake-close {

            position: absolute;

            top: 10px;
            right: 10px;

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.75);

            color: #fff;

            font-size: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            padding: 0;

            z-index: 40;

            touch-action: manipulation;
        }


        /* =====================================
           控制按鈕
        ===================================== */

        .controls {

            position: absolute;

            left: 10px;
            bottom: 10px;

            display: flex;

            gap: 7px;

            opacity: 0;

            transition:
                opacity 0.2s ease;

            z-index: 40;
        }


        .video-container:hover .controls {
            opacity: 1;
        }


        .control-button {

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.75);

            color: #fff;

            font-size: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            padding: 0;

            touch-action: manipulation;
        }


        /* =====================================
           暴走模式
        ===================================== */

        .berserk {

            animation:
                shake 0.18s infinite;
        }


        @keyframes shake {

            0% {
                transform:
                    translate(0, 0)
                    rotate(0deg);
            }

            25% {
                transform:
                    translate(10px, -7px)
                    rotate(1deg);
            }

            50% {
                transform:
                    translate(-9px, 9px)
                    rotate(-1deg);
            }

            75% {
                transform:
                    translate(8px, 5px)
                    rotate(1deg);
            }

            100% {
                transform:
                    translate(0, 0)
                    rotate(0deg);
            }
        }


        /* =====================================
           全螢幕
        ===================================== */

        .fullscreen-funny {

            left: 50% !important;
            top: 50% !important;

            right: auto !important;
            bottom: auto !important;

            transform:
                translate(-50%, -50%) !important;

            width:
                min(94vw, 1100px) !important;

            height: auto !important;

            aspect-ratio: 16 / 9;

            border-radius: 16px;

            box-shadow:
                0 20px 80px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================
           復活按鈕
        ===================================== */

        .revive-button {

            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 9998;

            display: none;

            border: none;

            padding: 14px 18px;

            border-radius: 999px;

            background: #000;

            color: #fff;

            font-size: 14px;

            cursor: pointer;
        }


        /* =====================================
           手機
        ===================================== */

        @media (max-width: 600px) {

            .video-container {

                right: 12px;
                bottom: 12px;

                width:
                    min(300px, calc(100vw - 24px));

                height: auto;

                aspect-ratio: 16 / 9;

                border-radius: 9px;
            }


            .sound-indicator {

                top: 7px;
                right: 44px;

                width: 31px;
                height: 31px;

                font-size: 14px;
            }


            .fake-close {

                top: 7px;
                right: 7px;

                width: 31px;
                height: 31px;

                font-size: 17px;
            }


            .controls {

                left: 7px;
                bottom: 7px;
            }


            .control-button {

                width: 31px;
                height: 31px;

                font-size: 13px;
            }


            .revive-button {

                right: 12px;
                bottom: 12px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================
         主圖片
    ===================================== -->

    <img
        class="main-image"
        id="mainImage"
        src="image.jpg"
        alt=""
    >


    <!-- =====================================
         浮動影片
    ===================================== -->

    <div
        class="video-container"
        id="videoContainer"
    >

        <video
            class="floating-video"
            id="floatingVideo"
            src="music.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        ></video>


        <div
            class="sound-indicator"
            id="soundIndicator"
        >
            🔇
        </div>


        <button
            class="fake-close"
            id="fakeClose"
            type="button"
        >
            ×
        </button>


        <div class="controls">

            <button
                class="control-button"
                id="playButton"
                type="button"
            >
                ▶
            </button>


            <button
                class="control-button"
                id="muteButton"
                type="button"
            >
                🔇
            </button>

        </div>

    </div>


    <!-- =====================================
         復活按鈕
    ===================================== -->

    <button
        class="revive-button"
        id="reviveButton"
        type="button"
    >
        影片不見了
    </button>



    <script>


        /* =====================================
           元素
        ===================================== */

        const video =
            document.getElementById(
                "floatingVideo"
            );

        const container =
            document.getElementById(
                "videoContainer"
            );

        const indicator =
            document.getElementById(
                "soundIndicator"
            );

        const fakeClose =
            document.getElementById(
                "fakeClose"
            );

        const playButton =
            document.getElementById(
                "playButton"
            );

        const muteButton =
            document.getElementById(
                "muteButton"
            );

        const reviveButton =
            document.getElementById(
                "reviveButton"
            );

        const mainImage =
            document.getElementById(
                "mainImage"
            );


        /* =====================================
           自動播放
        ===================================== */

        window.addEventListener(
            "load",
            function () {

                video.muted = true;

                video.loop = true;

                video.play().catch(
                    function () {}
                );

            }
        );


        /* =====================================
           記住位置
        ===================================== */

        const savedLeft =
            localStorage.getItem(
                "berserkVideoLeft"
            );

        const savedTop =
            localStorage.getItem(
                "berserkVideoTop"
            );


        if (
            savedLeft !== null &&
            savedTop !== null
        ) {

            container.style.left =
                savedLeft + "px";

            container.style.top =
                savedTop + "px";

            container.style.right =
                "auto";

            container.style.bottom =
                "auto";
        }


        /* =====================================
           拖曳
           
           ★ 移動就算一次
           ★ 不需要放開
           ★ 每 3 次放大
           ★ 無限放大
        ===================================== */

        let isDragging = false;

        let moved = false;

        let startX = 0;
        let startY = 0;

        let startLeft = 0;
        let startTop = 0;

        let dragMoveCount = 0;

        let lastCountX = 0;
        let lastCountY = 0;


        container.addEventListener(
            "pointerdown",
            function (event) {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {
                    return;
                }


                if (
                    container.classList.contains(
                        "fullscreen-funny"
                    )
                ) {
                    return;
                }


                isDragging = true;

                moved = false;


                startX =
                    event.clientX;

                startY =
                    event.clientY;


                lastCountX =
                    event.clientX;

                lastCountY =
                    event.clientY;


                const rect =
                    container.getBoundingClientRect();


                startLeft =
                    rect.left;

                startTop =
                    rect.top;


                container.setPointerCapture(
                    event.pointerId
                );

            }
        );


        container.addEventListener(
            "pointermove",
            function (event) {

                if (!isDragging) {
                    return;
                }


                const dx =
                    event.clientX -
                    startX;

                const dy =
                    event.clientY -
                    startY;


                if (
                    Math.abs(dx) > 3 ||
                    Math.abs(dy) > 3
                ) {

                    moved = true;
                }


                /* =========================
                   實際拖曳
                ========================= */

                let newLeft =
                    startLeft + dx;

                let newTop =
                    startTop + dy;


                const maxLeft =
                    Math.max(
                        0,
                        window.innerWidth -
                        container.offsetWidth
                    );


                const maxTop =
                    Math.max(
                        0,
                        window.innerHeight -
                        container.offsetHeight
                    );


                newLeft =
                    Math.max(
                        0,
                        Math.min(
                            newLeft,
                            maxLeft
                        )
                    );


                newTop =
                    Math.max(
                        0,
                        Math.min(
                            newTop,
                            maxTop
                        )
                    );


                container.style.left =
                    newLeft + "px";

                container.style.top =
                    newTop + "px";

                container.style.right =
                    "auto";

                container.style.bottom =
                    "auto";


                /* =========================
                   移動距離計數
                   
                   每 15px 算一次
                ========================= */

                const moveX =
                    event.clientX -
                    lastCountX;

                const moveY =
                    event.clientY -
                    lastCountY;


                const moveDistance =
                    Math.sqrt(
                        moveX * moveX +
                        moveY * moveY
                    );


                if (
                    moveDistance >= 15
                ) {

                    const steps =
                        Math.floor(
                            moveDistance / 15
                        );


                    dragMoveCount +=
                        steps;


                    const ratio =
                        (15 * steps) /
                        moveDistance;


                    lastCountX +=
                        moveX * ratio;

                    lastCountY +=
                        moveY * ratio;


                    /*
                     每 3 次就放大
                    */

                    while (
                        dragMoveCount >= 3
                    ) {

                        dragMoveCount -= 3;

                        enlargeHuge();

                    }

                }


                localStorage.setItem(
                    "berserkVideoLeft",
                    newLeft
                );

                localStorage.setItem(
                    "berserkVideoTop",
                    newTop
                );

            }
        );


        container.addEventListener(
            "pointerup",
            function (event) {

                isDragging = false;


                try {

                    container.releasePointerCapture(
                        event.pointerId
                    );

                } catch (error) {}

            }
        );


        container.addEventListener(
            "pointercancel",
            function () {

                isDragging = false;

            }
        );


        /* =====================================
           無限放大
        ===================================== */

        function enlargeHuge() {

            if (
                container.classList.contains(
                    "fullscreen-funny"
                )
            ) {
                return;
            }


            const currentWidth =
                container.offsetWidth;


            /*
             ★ 每次 +150～250px
             ★ 沒有最大值
            */

            const increase =
                150 +
                Math.random() * 100;


            const newWidth =
                currentWidth +
                increase;


            const newHeight =
                Math.round(
                    newWidth * 9 / 16
                );


            container.style.width =
                newWidth + "px";

            container.style.height =
                newHeight + "px";


            /*
             如果變太大，
             保持至少一部分在螢幕裡
            */

            const rect =
                container.getBoundingClientRect();


            let newLeft =
                rect.left;

            let newTop =
                rect.top;


            if (
                newLeft >
                window.innerWidth - 50
            ) {

                newLeft =
                    window.innerWidth - 50;

            }


            if (
                newTop >
                window.innerHeight - 50
            ) {

                newTop =
                    window.innerHeight - 50;

            }


            container.style.left =
                newLeft + "px";

            container.style.top =
                newTop + "px";

            container.style.right =
                "auto";

            container.style.bottom =
                "auto";

        }


        /* =====================================
           隨機尺寸
        ===================================== */

        function randomSize() {

            if (
                container.classList.contains(
                    "fullscreen-funny"
                )
            ) {
                return;
            }


            const mobile =
                window.innerWidth <= 600;


            let min;
            let max;


            if (mobile) {

                min = 130;

                max =
                    Math.max(
                        140,
                        window.innerWidth * 1.5
                    );

            } else {

                min = 220;

                max =
                    Math.max(
                        300,
                        window.innerWidth * 1.5
                    );

            }


            const width =
                min +
                Math.random() *
                (max - min);


            const height =
                Math.round(
                    width * 9 / 16
                );


            container.style.width =
                width + "px";

            container.style.height =
                height + "px";

        }


        /* =====================================
           瞬移
        ===================================== */

        function teleportVideo() {

            if (
                container.classList.contains(
                    "fullscreen-funny"
                )
            ) {
                return;
            }


            const margin = 5;


            const maxLeft =
                window.innerWidth -
                container.offsetWidth -
                margin;


            const maxTop =
                window.innerHeight -
                container.offsetHeight -
                margin;


            /*
             如果影片比螢幕還大，
             允許它超出畫面
            */

            let left;
            let top;


            if (maxLeft <= margin) {

                left =
                    Math.random() *
                    Math.max(
                        50,
                        window.innerWidth
                    ) -
                    container.offsetWidth *
                    0.5;

            } else {

                left =
                    margin +
                    Math.random() *
                    (maxLeft - margin);

            }


            if (maxTop <= margin) {

                top =
                    Math.random() *
                    Math.max(
                        50,
                        window.innerHeight
                    ) -
                    container.offsetHeight *
                    0.5;

            } else {

                top =
                    margin +
                    Math.random() *
                    (maxTop - margin);

            }


            container.style.left =
                left + "px";

            container.style.top =
                top + "px";

            container.style.right =
                "auto";

            container.style.bottom =
                "auto";


            localStorage.setItem(
                "berserkVideoLeft",
                left
            );

            localStorage.setItem(
                "berserkVideoTop",
                top
            );

        }


        /* =====================================
           連續瞬移
        ===================================== */

        function crazyTeleport() {

            let count = 0;


            const timer =
                setInterval(
                    function () {

                        teleportVideo();

                        count++;


                        if (
                            count >= 4
                        ) {

                            clearInterval(
                                timer
                            );

                        }

                    },
                    180
                );

        }


        /* =====================================
           暴走模式
        ===================================== */

        let berserk = false;


        function startBerserkMode() {

            if (berserk) {
                return;
            }


            berserk = true;


            container.classList.add(
                "berserk"
            );


            crazyTeleport();

            randomSize();


            setTimeout(
                function () {

                    teleportVideo();

                    randomSize();

                },
                1200
            );


            setTimeout(
                function () {

                    container.classList.remove(
                        "berserk"
                    );

                    berserk = false;

                },
                2400
            );

        }


        /* =====================================
           點影片
        ===================================== */

        container.addEventListener(
            "click",
            function (event) {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {
                    return;
                }


                if (moved) {

                    moved = false;

                    return;
                }


                toggleMute();

            }
        );


        /* =====================================
           聲音
        ===================================== */

        function toggleMute() {

            if (video.muted) {

                video.muted = false;

                video.volume = 1;

                indicator.textContent =
                    "🔊";

                muteButton.textContent =
                    "🔊";

                video.play();

            } else {

                video.muted = true;

                indicator.textContent =
                    "🔇";

                muteButton.textContent =
                    "🔇";

            }

        }


        /* =====================================
           播放 / 暫停
        ===================================== */

        playButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                if (video.paused) {

                    video.play();

                    playButton.textContent =
                        "⏸";

                } else {

                    video.pause();

                    playButton.textContent =
                        "▶";

                }

            }
        );


        /* =====================================
           靜音按鈕
        ===================================== */

        muteButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                toggleMute();

            }
        );


        /* =====================================
           雙擊放大
        ===================================== */

        container.addEventListener(
            "dblclick",
            function (event) {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {
                    return;
                }


                container.classList.toggle(
                    "fullscreen-funny"
                );

            }
        );


        /* =====================================
           假 ×
           
           第一次：連續瞬移
           第二次：消失
        ===================================== */

        let closeClicks = 0;

        let closeTimer = null;


        fakeClose.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                closeClicks++;


                if (
                    closeClicks === 1
                ) {

                    crazyTeleport();


                    closeTimer =
                        setTimeout(
                            function () {

                                closeClicks = 0;

                            },
                            1000
                        );

                } else {

                    clearTimeout(
                        closeTimer
                    );

                    closeClicks = 0;

                    hideVideo();

                }

            }
        );


        /* =====================================
           消失
        ===================================== */

        function hideVideo() {

            container.style.display =
                "none";

            reviveButton.style.display =
                "block";


            setTimeout(
                function () {

                    reviveVideo();

                },
                5000
            );

        }


        function reviveVideo() {

            container.style.display =
                "block";

            reviveButton.style.display =
                "none";


            randomSize();

            crazyTeleport();

        }


        reviveButton.addEventListener(
            "click",
            function () {

                reviveVideo();

            }
        );


        /* =====================================
           電腦：
           滑鼠靠近就逃跑
        ===================================== */

        let lastMouseEscape = 0;


        document.addEventListener(
            "pointermove",
            function (event) {

                if (
                    event.pointerType !==
                    "mouse"
                ) {
                    return;
                }


                if (berserk) {
                    return;
                }


                if (
                    container.classList.contains(
                        "fullscreen-funny"
                    )
                ) {
                    return;
                }


                const now =
                    Date.now();


                if (
                    now - lastMouseEscape <
                    700
                ) {
                    return;
                }


                const rect =
                    container.getBoundingClientRect();


                /*
                 影片周圍 180px
                */

                const expanded = {

                    left:
                        rect.left - 180,

                    right:
                        rect.right + 180,

                    top:
                        rect.top - 180,

                    bottom:
                        rect.bottom + 180

                };


                if (

                    event.clientX >
                    expanded.left &&

                    event.clientX <
                    expanded.right &&

                    event.clientY >
                    expanded.top &&

                    event.clientY <
                    expanded.bottom

                ) {

                    lastMouseEscape =
                        now;


                    teleportVideo();

                }

            }
        );


        /* =====================================
           手機：
           碰影片有機率逃跑
        ===================================== */

        let touchCount = 0;


        container.addEventListener(
            "pointerdown",
            function (event) {

                if (
                    event.pointerType !==
                    "touch"
                ) {
                    return;
                }


                touchCount++;


                if (
                    Math.random() < 0.45
                ) {

                    setTimeout(
                        function () {

                            if (
                                !isDragging
                            ) {

                                teleportVideo();

                            }

                        },
                        100
                    );

                }


                /*
                 摸三次直接暴走
                */

                if (
                    touchCount >= 3
                ) {

                    touchCount = 0;

                    startBerserkMode();

                }

            }
        );


        /* =====================================
           手機：
           碰主圖片
        ===================================== */

        mainImage.addEventListener(
            "pointerdown",
            function (event) {

                if (
                    event.pointerType !==
                    "touch"
                ) {
                    return;
                }


                if (
                    Math.random() < 0.4
                ) {

                    setTimeout(
                        function () {

                            teleportVideo();

                        },
                        150
                    );

                }

            }
        );


        /* =====================================
           手機：
           長按
        ===================================== */

        let longPressTimer = null;


        container.addEventListener(
            "pointerdown",
            function (event) {

                if (
                    event.pointerType !==
                    "touch"
                ) {
                    return;
                }


                longPressTimer =
                    setTimeout(
                        function () {

                            if (
                                !isDragging
                            ) {

                                startBerserkMode();

                            }

                        },
                        650
                    );

            }
        );


        container.addEventListener(
            "pointerup",
            function () {

                clearTimeout(
                    longPressTimer
                );

            }
        );


        container.addEventListener(
            "pointercancel",
            function () {

                clearTimeout(
                    longPressTimer
                );

            }
        );


        /* =====================================
           自己亂跑
           
           12～30 秒
        ===================================== */

        function randomAutoChaos() {

            const delay =
                12000 +
                Math.random() * 18000;


            setTimeout(
                function () {

                    if (
                        Math.random() < 0.75
                    ) {

                        if (
                            Math.random() < 0.45
                        ) {

                            crazyTeleport();

                        }


                        randomSize();


                        if (
                            Math.random() < 0.3
                        ) {

                            startBerserkMode();

                        }

                    }


                    randomAutoChaos();

                },
                delay
            );

        }


        randomAutoChaos();


        /* =====================================
           螢幕尺寸改變
        ===================================== */

        window.addEventListener(
            "resize",
            function () {

                if (
                    container.style.display ===
                    "none"
                ) {
                    return;
                }


                if (
                    container.classList.contains(
                        "fullscreen-funny"
                    )
                ) {
                    return;
                }


                const rect =
                    container.getBoundingClientRect();


                /*
                 影片如果太大，
                 不強制縮小。
                 
                 只確保位置不要完全跑掉。
                */

                let left =
                    rect.left;

                let top =
                    rect.top;


                if (
                    left >
                    window.innerWidth - 30
                ) {

                    left =
                        window.innerWidth - 30;

                }


                if (
                    top >
                    window.innerHeight - 30
                ) {

                    top =
                        window.innerHeight - 30;

                }


                container.style.left =
                    left + "px";

                container.style.top =
                    top + "px";

                container.style.right =
                    "auto";

                container.style.bottom =
                    "auto";

            }
        );


    </script>

</body>
